<!DOCTYPE html>
<html>
<head>
  <title>Random Video Chat</title>
  <style>
    body { text-align:center; font-family:Arial }
    video { width:300px; height:220px; background:black; margin:10px }
    #chat { width:620px; margin:auto }
    #messages { height:120px; overflow:auto; border:1px solid #ccc; margin-bottom:5px }
  </style>
</head>
<body>

<h2>🎥 Random Video + Text Chat</h2>

<video id="localVideo" autoplay muted playsinline></video>
<video id="remoteVideo" autoplay playsinline></video>

<div id="chat">
  <div id="messages"></div>
  <input id="msg" placeholder="Type message..." />
  <button onclick="sendMsg()">Send</button>
</div>

<br>
<button onclick="nextUser()">Next</button>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
